navigation = "2.10.2"
legacySupport = "1.0.0"
mockk = "1.14.12"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
fragment = "1.9.1"
activity = "1.13.0"
coil = "3.6.3"
picasso = "2.71828"
cardview = "1.0.0"
