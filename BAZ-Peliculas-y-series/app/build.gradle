plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.dagger.hilt.android'
    alias(libs.plugins.ksp)
    alias(libs.plugins.ktlint)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.andresrivas.bazpeliculasyseries'
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId "com.andresrivas.bazpeliculasyseries"
        minSdk = 24
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        dataBinding = true
        compose = true
    }
}

ktlint {
    android = true
    ignoreFailures = false
    reporters {
        reporter "plain"
        reporter "checkstyle"
        reporter "sarif"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation project(':app:RemoteDataSource')
    implementation project(':app:LocalDataSource')
    implementation project(':app:Common')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.cardview
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout

    implementation libs.coil.compose
    implementation libs.picasso
    implementation libs.gson
    implementation libs.glide.compose

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase
    implementation libs.play.services.auth

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material
    implementation libs.compose.material.icons.core
    implementation libs.compose.material.icons.extended
    implementation libs.compose.material3
    implementation libs.compose.material3.window.size
    implementation libs.compose.runtime.livedata
    implementation libs.compose.runtime.rxjava2
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    // Rx
    implementation libs.rxjava3
    implementation libs.retrofit.adapter.rxjava3

    // Unit test
    testImplementation libs.mockk
    testImplementation libs.junit

    // Instrumentation test
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
    androidTestImplementation libs.compose.ui.test.junit4

    debugImplementation(libs.androidx.fragment.testing) {
        exclude group: 'androidx.test', module: 'core'
    }
}